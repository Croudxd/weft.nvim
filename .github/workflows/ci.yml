name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      - name: Install formatter and chat test dependencies
        run: |
          sudo snap install stylua --classic
          mkdir -p "$HOME/.local/share/nvim/lazy"
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim "$HOME/.local/share/nvim/lazy/plenary.nvim"
          git clone https://github.com/olimorris/codecompanion.nvim "$HOME/.local/share/nvim/lazy/codecompanion.nvim"
          git -C "$HOME/.local/share/nvim/lazy/codecompanion.nvim" checkout 799526fb35548c26e2dd74c3b282537bb8122a3b
          git clone https://github.com/viespejo/cc-adapter-codex.nvim "$HOME/.local/share/nvim/lazy/cc-adapter-codex.nvim"
          git -C "$HOME/.local/share/nvim/lazy/cc-adapter-codex.nvim" checkout ce565d3da357e99ecabc9db0558c8bea42158c32
      - name: Run checks
        run: |
          make check
          make test
          make test-chat
